name: Profile cards

# Cards are rebuilt here and served as static files from the `output` branch, so the
# README never waits on a stats API. A failed run keeps the previous cards.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cards/**'
      - '.github/workflows/cards.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build cards
        run: node scripts/cards/main.mjs dist
        env:
          # Optional CARDS_TOKEN (a token from the profile owner) adds private repos
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}

      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --quiet --message 'Update profile cards'
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
