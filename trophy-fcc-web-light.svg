<svg xmlns="http://www.w3.org/2000/svg" width="408" height="104" viewBox="0 0 408 104" fill="none" role="img" aria-label="Responsive Web Design, FREECODECAMP">
<title>Responsive Web Design, FREECODECAMP</title>
<style>
text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; fill: #6b6385; }
.name { font-size: 15px; font-weight: 700; fill: #1d1533; }
@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade 0.7s ease-out both; }
  @keyframes fade { from { opacity: 0; } }
  .sheen { animation: sheen 8s ease-in-out 4s infinite; }
  @keyframes sheen { 0% { opacity: 0; transform: translateX(0); } 6% { opacity: 1; } 22%, 100% { opacity: 0; transform: translateX(560px); } }
}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fefcff"/><stop offset="1" stop-color="#f1ebff"/></linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fae"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0177a"/><stop offset="0.5" stop-color="#8b2be2"/><stop offset="1" stop-color="#0e91b5"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb020"/><stop offset="0.5" stop-color="#ff7a1f"/><stop offset="1" stop-color="#e0177a"/></linearGradient>
<radialGradient id="glow-a"><stop offset="0" stop-color="#ff2e97" stop-opacity="0.32"/><stop offset="1" stop-color="#ff2e97" stop-opacity="0"/></radialGradient>
<radialGradient id="glow-b"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#1d1533" fill-opacity="0.07"/></pattern>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="400" height="84" rx="14"/></clipPath>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb020"/><stop offset="0.33" stop-color="#ff2e97"/><stop offset="0.67" stop-color="#8b2be2"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<g transform="translate(4 4)">
<g clip-path="url(#card)">
<rect width="400" height="84" fill="url(#bg)"/>
<rect width="400" height="84" fill="url(#dots)"/>
<circle cx="400" cy="0" r="84" fill="url(#glow-a)"/>
<circle cx="0" cy="84" r="75.6" fill="url(#glow-b)"/>
<circle cx="44" cy="42" r="24" fill="#f1ebff" fill-opacity="0.55" stroke="url(#ring)" stroke-width="2" filter="url(#soft)"/>
<g transform="translate(32 30)"><path stroke="url(#hot)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2.5 9.5 12 5l9.5 4.5L12 14Z M6.5 11.5v4.2c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8v-4.2 M21.5 9.5v5"/></g>
<g class="fade">
<text class="eyebrow" x="84" y="36">FREECODECAMP</text>
<text class="name" x="84" y="58">Responsive Web Design</text>
</g>
<path stroke="#6b6385" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M370 36H380V46M380 36L369 47"/>
<g transform="skewX(-20)"><rect class="sheen" x="-100" y="0" width="70" height="84" fill="url(#sheen)" opacity="0"/></g>
</g>
<rect x="0.75" y="0.75" width="398.5" height="82.5" rx="13.25" stroke="url(#border)" stroke-opacity="0.75" stroke-width="1.5"/>
</g>
</svg>
